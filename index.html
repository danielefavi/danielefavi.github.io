<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hi, I'm Daniele, a software engineer.">
    <title>Daniele Favi — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #fff;
        color: #030303;
        font-family: "Source Code Pro", "Courier New", monospace;
        line-height: 1.5;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 52rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.25rem, 3vw, 1.5rem);
        font-weight: 700;
        text-wrap: balance;
      }

      p {
        margin: 1.5rem 0 0;
      }

      a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 0.25em;
        overflow-wrap: anywhere;
      }

      a:hover {
        text-decoration-thickness: 2px;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 6px;
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hi, I'm Daniele, a software engineer.</h1>
      <p><a href="https://danielefavi.com">danielefavi.com</a></p>
    </main>
  </body>
</html>
