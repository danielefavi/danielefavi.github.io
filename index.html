<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniele Favi — Engineering Tech Lead</title>
<meta name="description" content="Daniele Favi — Tech Engineer Lead. Find me on GitHub and LinkedIn.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23141412'/><rect x='10' y='10' width='4' height='4' fill='%23C0392B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#F7F5F0;
  --ink:#141412;
  --signal:#C0392B;
  --ink-soft:color-mix(in srgb,var(--ink) 66%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 30%,var(--paper));

  --font-mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --font-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  --fs-display:clamp(3.4rem,1.6rem + 7vw,6.75rem);
  --fs-h4:1.125rem;
  --fs-body:1.0625rem;
  --fs-small:.85rem;

  --sp-1:.25rem;--sp-2:.5rem;--sp-3:1rem;--sp-4:1.5rem;--sp-5:2.5rem;--sp-6:4rem;

  --radius:2px;
  --shadow-press:4px 4px 0 0 var(--ink);
  --col-reading:42rem;
  --tick:120ms;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 var(--fs-body)/1.7 var(--font-mono);
  scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper);
}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
svg{display:inline-block;vertical-align:middle}
.ic{width:18px;height:18px;flex:none}
.hero{position:relative;overflow:hidden;
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;
  padding:var(--sp-4) var(--sp-3)}
@media(min-width:48rem){.hero{padding-inline:var(--sp-5)}}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(var(--line) 1px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);
  mask-image:linear-gradient(to bottom,#000 55%,transparent)}
.hero-inner{position:relative;max-width:var(--col-reading);margin-inline:auto}
.prompt{font:500 var(--fs-small) var(--font-mono);color:var(--ink-soft);margin:0 0 var(--sp-3)}
.sig{color:var(--signal);font-weight:600}
.display{font:700 var(--fs-display)/0.95 var(--font-display);
  text-transform:uppercase;text-wrap:balance;margin:.5rem 0 .8rem}
.subtitle{font:600 var(--fs-h4) var(--font-mono);text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-soft);margin:0}
.cursor::after{content:"_";font-weight:700;animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font:700 .95rem var(--font-sans);text-transform:uppercase;letter-spacing:.02em;
  text-decoration:none;cursor:pointer;padding:.8rem 1.6rem;
  border:2px solid var(--ink);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);box-shadow:var(--shadow-press);
  transition:background-color var(--tick),color var(--tick),box-shadow var(--tick),transform var(--tick)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 0 var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-5)}
.footer{padding:var(--sp-6) var(--sp-3) var(--sp-5);text-align:center}
.footer .dots{margin:0;font:400 var(--fs-small) var(--font-mono);
  letter-spacing:.35em;color:var(--ink-soft)}
.footer small{display:block;margin-top:var(--sp-2);font:400 .68rem var(--font-mono);color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<main class="hero">
  <div class="hero-inner">
    <p class="prompt"><span class="sig">$</span> whoami</p>
    <h1 class="display">Daniele Favi</h1>
    <p class="subtitle">Engineering Tech Lead<span class="cursor" aria-hidden="true"></span></p>
    <div class="btn-row">
      <a class="btn" href="https://github.com/danielefavi" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.53-1.33-1.3-1.68-1.3-1.68-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.74 1.27 3.4.97.1-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.66.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.17 0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
        GitHub
      </a>
      <a class="btn" href="https://www.linkedin.com/in/daniele-favi" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        LinkedIn
      </a>
    </div>
  </div>
</main>

<footer class="footer">
  <p class="dots" aria-hidden="true">. . .</p>
  <small>danielefavi.com · 2026</small>
</footer>

</body>
</html>
